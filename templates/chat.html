<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chat-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        #chat-box {
            border: 1px solid #ddd;
            background: #fafafa;
            height: 420px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .msg {
            margin-bottom: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user {
            font-weight: bold;
            color: #0056b3;
        }

        .bot {
            font-weight: bold;
            color: #28a745;
        }

        .error-msg {
            font-weight: bold;
            color: #dc3545;
        }

        .timestamp {
            margin-left: 8px;
            font-size: 11px;
            color: #888;
            font-weight: normal;
            white-space: nowrap;
        }

        .date-separator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
            color: #777;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .date-separator::before,
        .date-separator::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .input-wrapper {
            margin-top: 5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .char-counter {
            text-align: right;
            margin-top: 5px;
            font-size: 12px;
            color: #777;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .logout-btn {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 13px;
        }

        .clear-btn {
            background: #6c757d;
            padding: 7px 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🤖 AI 챗봇 서비스</h2>

        <div>
            <span>
                로그인 계정:
                <b id="user-display"></b>
            </span>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                로그아웃
            </button>
        </div>
    </div>


    <!-- 대화 기록 삭제 -->
    <div class="chat-actions">
        <button
            class="clear-btn"
            id="clear-btn"
            onclick="clearChatHistory()"
        >
            대화 기록 삭제
        </button>
    </div>


    <!-- 채팅 메시지 영역 -->
    <div id="chat-box"></div>


    <!-- 질문 입력 영역 -->
    <div class="input-wrapper">

        <div class="input-group">

            <input
                type="text"
                id="question"
                placeholder="질문을 입력하세요..."
                maxlength="500"
            >

            <button
                id="send-btn"
                onclick="sendMsg()"
            >
                전송
            </button>

        </div>

        <div
            class="char-counter"
            id="char-counter"
        >
            500자 남음
        </div>

    </div>


    <script>

        // -----------------------------------------------------------
        // 현재 사용자명
        //
        // 화면 표시용이며 실제 인증은 JWT로 수행합니다.
        // -----------------------------------------------------------
        const currentUsername =
            localStorage.getItem('username');


        // 질문 최대 길이
        const MAX_QUESTION_LENGTH = 500;


        // 화면 시간대
        const DISPLAY_TIME_ZONE =
            'Asia/Seoul';


        // 마지막으로 화면에 표시된 날짜
        let lastDisplayedDate = null;


        // -----------------------------------------------------------
        // 현재 JWT Access Token 조회
        //
        // token을 페이지 시작 시 한 번만 읽지 않고,
        // 필요한 시점마다 localStorage에서 다시 읽습니다.
        //
        // 로그아웃 이후 Back/Forward로 이전 화면이 복원되는 경우
        // 오래된 token 값을 계속 사용하는 것을 방지합니다.
        // -----------------------------------------------------------
        function getToken() {
            return localStorage.getItem('token');
        }


        // -----------------------------------------------------------
        // 현재 인증 상태 확인
        //
        // JWT가 없다면 보호된 chat 페이지를 사용할 수 없도록
        // 로그인 페이지로 이동합니다.
        // -----------------------------------------------------------
        function checkAuthentication() {

            if (!getToken()) {

                window.location.replace('/login');

                return false;
            }

            return true;
        }


        // -----------------------------------------------------------
        // 페이지 최초 로드
        // -----------------------------------------------------------
        window.addEventListener(
            'load',
            () => {

                if (!checkAuthentication()) {
                    return;
                }

                document
                    .getElementById('user-display')
                    .textContent =
                        currentUsername || '사용자';

                loadChatHistory();
            }
        );


        // -----------------------------------------------------------
        // 브라우저 Back / Forward 대응
        //
        // BFCache에서 이전 /chat 화면이 복원되는 경우에도
        // pageshow 이벤트가 발생하므로 token을 다시 검사합니다.
        //
        // 로그아웃 후 뒤로가기를 하더라도
        // token이 없으면 즉시 /login으로 이동합니다.
        // -----------------------------------------------------------
        window.addEventListener(
            'pageshow',
            () => {
                checkAuthentication();
            }
        );


        // -----------------------------------------------------------
        // 질문 입력창 / 글자 수 Counter
        // -----------------------------------------------------------
        const questionInput =
            document.getElementById('question');

        const charCounter =
            document.getElementById('char-counter');


        // -----------------------------------------------------------
        // 질문 글자 수 실시간 표시
        //
        // Backend의 Pydantic max_length=500과
        // 동일한 제한을 Frontend에도 적용합니다.
        //
        // Korean/English mixed input, 붙여넣기, IME 입력 등으로
        // 혹시 500자를 초과하는 값이 들어오는 경우에도
        // 실제 문자열을 500자로 잘라냅니다.
        //
        // 또한 Math.max()를 사용하여
        // "-1자 남음" 같은 음수 표시가 절대로 나오지 않게 합니다.
        // -----------------------------------------------------------
        questionInput.addEventListener(
            'input',
            () => {

                // 500자를 초과한 경우 강제로 500자까지만 유지
                if (
                    questionInput.value.length
                    > MAX_QUESTION_LENGTH
                ) {

                    questionInput.value =
                        questionInput.value.slice(
                            0,
                            MAX_QUESTION_LENGTH
                        );
                }


                const currentLength =
                    questionInput.value.length;


                const remaining =
                    Math.max(
                        0,
                        MAX_QUESTION_LENGTH
                        - currentLength
                    );


                charCounter.textContent =
                    `${remaining}자 남음`;
            }
        );


        // -----------------------------------------------------------
        // Enter 키로 메시지 전송
        // -----------------------------------------------------------
        questionInput.addEventListener(
            'keydown',
            (event) => {

                if (
                    event.key === 'Enter'
                ) {

                    event.preventDefault();

                    sendMsg();
                }
            }
        );


        // -----------------------------------------------------------
        // 로그아웃
        //
        // 현재 애플리케이션의 인증 정보만 삭제하고
        // 로그인 페이지로 이동합니다.
        // -----------------------------------------------------------
        function logout() {

            localStorage.removeItem('token');
            localStorage.removeItem('username');

            window.location.replace('/login');
        }


        // -----------------------------------------------------------
        // Timestamp 파싱
        //
        // DB의 created_at은 datetime.utcnow() 기반이므로 UTC입니다.
        //
        // Python isoformat()이 timezone 없는 문자열을 반환하는 경우
        // 끝에 Z를 추가해서 JavaScript가 UTC로 해석하도록 합니다.
        // -----------------------------------------------------------
        function parseTimestamp(timestamp) {

            if (!timestamp) {
                return null;
            }


            if (
                timestamp instanceof Date
            ) {
                return timestamp;
            }


            let normalizedTimestamp =
                String(timestamp);


            if (
                !normalizedTimestamp.endsWith('Z')
                &&
                !/[+-]\d{2}:\d{2}$/.test(
                    normalizedTimestamp
                )
            ) {

                normalizedTimestamp =
                    `${normalizedTimestamp}Z`;
            }


            const date =
                new Date(
                    normalizedTimestamp
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return null;
            }


            return date;
        }


        // -----------------------------------------------------------
        // 메시지 시간 표시
        //
        // UTC → KST
        //
        // 예:
        // 06:01 UTC
        // ↓
        // 15:01 KST
        // -----------------------------------------------------------
        function formatTimestamp(timestamp) {

            const date =
                parseTimestamp(
                    timestamp
                );


            if (!date) {
                return '';
            }


            return date.toLocaleTimeString(
                'ko-KR',
                {
                    timeZone:
                        DISPLAY_TIME_ZONE,

                    hour:
                        '2-digit',

                    minute:
                        '2-digit',

                    hour12:
                        false
                }
            );
        }


        // -----------------------------------------------------------
        // 날짜 비교용 Key
        //
        // KST 기준:
        // 2026-08-15
        // -----------------------------------------------------------
        function getDateKey(timestamp) {

            const date =
                parseTimestamp(
                    timestamp
                );


            if (!date) {
                return '';
            }


            const parts =
                new Intl.DateTimeFormat(
                    'en-CA',
                    {
                        timeZone:
                            DISPLAY_TIME_ZONE,

                        year:
                            'numeric',

                        month:
                            '2-digit',

                        day:
                            '2-digit'
                    }
                ).formatToParts(
                    date
                );


            const year =
                parts.find(
                    part =>
                        part.type === 'year'
                )?.value;


            const month =
                parts.find(
                    part =>
                        part.type === 'month'
                )?.value;


            const day =
                parts.find(
                    part =>
                        part.type === 'day'
                )?.value;


            if (
                !year
                || !month
                || !day
            ) {
                return '';
            }


            return (
                `${year}-${month}-${day}`
            );
        }


        // -----------------------------------------------------------
        // 날짜 표시 문자열
        //
        // 예:
        // 2026년 8월 15일
        // -----------------------------------------------------------
        function formatDate(timestamp) {

            const date =
                parseTimestamp(
                    timestamp
                );


            if (!date) {
                return '';
            }


            return date.toLocaleDateString(
                'ko-KR',
                {
                    timeZone:
                        DISPLAY_TIME_ZONE,

                    year:
                        'numeric',

                    month:
                        'long',

                    day:
                        'numeric'
                }
            );
        }


        // -----------------------------------------------------------
        // 날짜가 변경되었을 때만 날짜 구분선 추가
        // -----------------------------------------------------------
        function appendDateSeparator(timestamp) {

            const dateKey =
                getDateKey(
                    timestamp
                );


            if (!dateKey) {
                return;
            }


            if (
                dateKey
                === lastDisplayedDate
            ) {

                return;
            }


            const box =
                document.getElementById(
                    'chat-box'
                );


            const separator =
                document.createElement(
                    'div'
                );


            separator.classList.add(
                'date-separator'
            );


            separator.textContent =
                formatDate(
                    timestamp
                );


            box.appendChild(
                separator
            );


            lastDisplayedDate =
                dateKey;
        }


        // -----------------------------------------------------------
        // 메시지를 안전하게 DOM에 추가
        //
        // innerHTML을 사용하지 않고 textContent를 사용합니다.
        //
        // 사용자 입력이나 AI 응답이 HTML/JavaScript 코드로
        // 실행되지 않고 일반 문자열로 표시됩니다.
        // -----------------------------------------------------------
        function appendMessage(
            role,
            message,
            isError = false,
            timestamp = null
        ) {

            const box =
                document.getElementById(
                    'chat-box'
                );


            appendDateSeparator(
                timestamp
            );


            const messageDiv =
                document.createElement(
                    'div'
                );


            messageDiv.classList.add(
                'msg'
            );


            if (isError) {

                messageDiv.classList.add(
                    'error-msg'
                );
            }


            const label =
                document.createElement(
                    'span'
                );


            if (
                role === 'user'
            ) {

                label.classList.add(
                    'user'
                );


                label.textContent =
                    `${
                        currentUsername
                        || '사용자'
                    }: `;

            } else {

                label.classList.add(
                    'bot'
                );


                if (isError) {

                    label.textContent =
                        '오류: ';

                } else {

                    label.textContent =
                        '챗봇: ';
                }
            }


            const messageText =
                document.createElement(
                    'span'
                );


            // -------------------------------------------------------
            // 핵심 XSS 방어
            //
            // HTML로 해석하지 않고 문자열 그대로 출력
            // -------------------------------------------------------
            messageText.textContent =
                String(
                    message ?? ''
                );


            messageDiv.appendChild(
                label
            );


            messageDiv.appendChild(
                messageText
            );


            // -------------------------------------------------------
            // Timestamp 표시
            // -------------------------------------------------------
            const formattedTime =
                formatTimestamp(
                    timestamp
                );


            if (formattedTime) {

                const timeSpan =
                    document.createElement(
                        'span'
                    );


                timeSpan.classList.add(
                    'timestamp'
                );


                timeSpan.textContent =
                    formattedTime;


                messageDiv.appendChild(
                    timeSpan
                );
            }


            box.appendChild(
                messageDiv
            );
        }


        // -----------------------------------------------------------
        // 기존 대화 이력 조회
        //
        // GET /api/me/chats
        // -----------------------------------------------------------
        async function loadChatHistory() {

            if (!checkAuthentication()) {
                return;
            }


            try {

                const res =
                    await fetch(
                        '/api/me/chats',
                        {
                            headers: {

                                'Authorization':
                                    `Bearer ${getToken()}`
                            }
                        }
                    );


                if (
                    res.status === 401
                ) {

                    logout();

                    return;
                }


                if (!res.ok) {

                    throw new Error(
                        `대화 이력 조회 실패 (${res.status})`
                    );
                }


                const logs =
                    await res.json();


                const box =
                    document.getElementById(
                        'chat-box'
                    );


                box.replaceChildren();


                lastDisplayedDate =
                    null;


                logs.forEach(
                    (log) => {

                        appendMessage(
                            'user',
                            log.question,
                            false,
                            log.time
                        );


                        appendMessage(
                            'bot',
                            log.response,
                            false,
                            log.time
                        );
                    }
                );


                box.scrollTop =
                    box.scrollHeight;


            } catch (err) {

                console.error(
                    '이력 로드 실패:',
                    err
                );
            }
        }


        // -----------------------------------------------------------
        // 대화 기록 전체 삭제
        //
        // DELETE /api/me/chats
        // -----------------------------------------------------------
        async function clearChatHistory() {

            if (!checkAuthentication()) {
                return;
            }


            const confirmed =
                confirm(
                    '저장된 대화 기록을 모두 삭제하시겠습니까?\n\n삭제된 기록은 복구할 수 없습니다.'
                );


            if (!confirmed) {
                return;
            }


            const clearBtn =
                document.getElementById(
                    'clear-btn'
                );


            clearBtn.disabled =
                true;


            clearBtn.innerText =
                '삭제 중...';


            try {

                const res =
                    await fetch(
                        '/api/me/chats',
                        {
                            method:
                                'DELETE',

                            headers: {

                                'Authorization':
                                    `Bearer ${getToken()}`
                            }
                        }
                    );


                if (
                    res.status === 401
                ) {

                    alert(
                        '로그인이 만료되었습니다.'
                    );


                    logout();

                    return;
                }


                const data =
                    await res.json();


                if (!res.ok) {

                    throw new Error(
                        data.detail
                        ||
                        '대화 기록 삭제에 실패했습니다.'
                    );
                }


                document
                    .getElementById(
                        'chat-box'
                    )
                    .replaceChildren();


                lastDisplayedDate =
                    null;


                alert(
                    '대화 기록이 삭제되었습니다.'
                );


            } catch (err) {

                console.error(
                    '대화 기록 삭제 실패:',
                    err
                );


                alert(
                    err.message
                    ||
                    '대화 기록 삭제 중 오류가 발생했습니다.'
                );


            } finally {

                clearBtn.disabled =
                    false;


                clearBtn.innerText =
                    '대화 기록 삭제';
            }
        }


        // -----------------------------------------------------------
        // 새로운 질문 전송
        //
        // POST /api/chat
        // -----------------------------------------------------------
        async function sendMsg() {

            if (!checkAuthentication()) {
                return;
            }


            const input =
                document.getElementById(
                    'question'
                );


            const btn =
                document.getElementById(
                    'send-btn'
                );


            const box =
                document.getElementById(
                    'chat-box'
                );


            const question =
                input.value.trim();


            // 빈 질문 차단
            if (!question) {

                alert(
                    '질문을 입력해주세요.'
                );

                return;
            }


            // -------------------------------------------------------
            // 방어적 길이 검증
            //
            // HTML maxlength와 별개로
            // JavaScript에서도 500자를 초과하지 않도록 확인합니다.
            // -------------------------------------------------------
            if (
                question.length
                > MAX_QUESTION_LENGTH
            ) {

                alert(
                    '질문은 최대 500자까지 입력할 수 있습니다.'
                );

                return;
            }


            // 중복 요청 방지
            input.disabled =
                true;

            btn.disabled =
                true;


            // 사용자 메시지를 먼저 화면에 표시
            const userTimestamp =
                new Date();


            appendMessage(
                'user',
                question,
                false,
                userTimestamp
            );


            input.value = '';


            charCounter.textContent =
                `${MAX_QUESTION_LENGTH}자 남음`;


            box.scrollTop =
                box.scrollHeight;


            try {

                const res =
                    await fetch(
                        '/api/chat',
                        {
                            method:
                                'POST',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    `Bearer ${getToken()}`
                            },

                            body:
                                JSON.stringify(
                                    {
                                        question:
                                            question
                                    }
                                )
                        }
                    );


                if (
                    res.status === 401
                ) {

                    alert(
                        '로그인이 만료되었습니다.'
                    );


                    logout();

                    return;
                }


                const data =
                    await res.json();


                if (!res.ok) {

                    let errorMessage =
                        '요청 처리 실패';


                    if (
                        typeof data.detail
                        === 'string'
                    ) {

                        errorMessage =
                            data.detail;

                    } else if (
                        typeof data.response
                        === 'string'
                    ) {

                        errorMessage =
                            data.response;
                    }


                    appendMessage(
                        'bot',
                        errorMessage,
                        true,
                        new Date()
                    );


                    return;
                }


                // 정상 AI 응답
                appendMessage(
                    'bot',
                    data.response,
                    false,
                    data.time
                );


            } catch (err) {

                console.error(
                    '채팅 요청 실패:',
                    err
                );


                appendMessage(
                    'bot',
                    '네트워크 연결 실패',
                    true,
                    new Date()
                );


            } finally {

                input.disabled =
                    false;


                btn.disabled =
                    false;


                input.focus();


                box.scrollTop =
                    box.scrollHeight;
            }
        }

    </script>

</body>
</html>
