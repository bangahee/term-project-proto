<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #chat-box {
            border: 1px solid #ddd;
            background: #fafafa;
            height: 420px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .msg {
            margin-bottom: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user {
            font-weight: bold;
            color: #0056b3;
        }

        .bot {
            font-weight: bold;
            color: #28a745;
        }

        .error-msg {
            font-weight: bold;
            color: #dc3545;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .logout-btn {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🤖 AI 챗봇 서비스</h2>

        <div>
            <span>
                로그인 계정:
                <b id="user-display"></b>
            </span>

            <button class="logout-btn" onclick="logout()">
                로그아웃
            </button>
        </div>
    </div>


    <div id="chat-box"></div>


    <div class="input-group">
        <input
            type="text"
            id="question"
            placeholder="질문을 입력하세요..."
        >

        <button id="send-btn" onclick="sendMsg()">
            전송
        </button>
    </div>


    <script>
        const token = localStorage.getItem('token');
        const currentUsername = localStorage.getItem('username');


        // -----------------------------------------------------------
        // 페이지 로드 시 인증 확인
        // -----------------------------------------------------------
        window.addEventListener('load', () => {
            if (!token) {
                alert('로그인이 필요합니다.');
                window.location.href = '/login';
                return;
            }

            document.getElementById('user-display').textContent =
                currentUsername || '사용자';

            loadChatHistory();
        });


        // -----------------------------------------------------------
        // Enter 키로 메시지 전송
        // -----------------------------------------------------------
        document
            .getElementById('question')
            .addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    sendMsg();
                }
            });


        // -----------------------------------------------------------
        // 로그아웃
        // -----------------------------------------------------------
        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }


        // -----------------------------------------------------------
        // 메시지를 안전하게 DOM에 추가
        //
        // innerHTML을 사용하지 않고 textContent를 사용하여
        // 사용자 입력 또는 AI 응답이 HTML로 실행되는 것을 방지
        // -----------------------------------------------------------
        function appendMessage(role, message, isError = false) {
            const box = document.getElementById('chat-box');

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('msg');

            if (isError) {
                messageDiv.classList.add('error-msg');
            }

            const label = document.createElement('span');

            if (role === 'user') {
                label.classList.add('user');
                label.textContent = `${currentUsername || '사용자'}: `;
            } else {
                label.classList.add('bot');

                if (isError) {
                    label.textContent = '오류: ';
                } else {
                    label.textContent = '챗봇: ';
                }
            }

            const messageText = document.createElement('span');

            // 핵심 보안 부분
            // HTML을 해석하지 않고 일반 문자열로 출력
            messageText.textContent = String(message ?? '');

            messageDiv.appendChild(label);
            messageDiv.appendChild(messageText);

            box.appendChild(messageDiv);
        }


        // -----------------------------------------------------------
        // 기존 대화 이력 조회
        // -----------------------------------------------------------
        async function loadChatHistory() {
            try {
                const res = await fetch('/api/me/chats', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                // JWT 만료 또는 인증 실패
                if (res.status === 401) {
                    logout();
                    return;
                }

                if (!res.ok) {
                    throw new Error(
                        `대화 이력 조회 실패 (${res.status})`
                    );
                }

                const logs = await res.json();

                const box = document.getElementById('chat-box');

                // 기존 메시지 제거
                box.replaceChildren();

                logs.forEach((log) => {
                    appendMessage(
                        'user',
                        log.question
                    );

                    appendMessage(
                        'bot',
                        log.response
                    );
                });

                box.scrollTop = box.scrollHeight;

            } catch (err) {
                console.error(
                    '이력 로드 실패:',
                    err
                );
            }
        }


        // -----------------------------------------------------------
        // 새로운 질문 전송
        // -----------------------------------------------------------
        async function sendMsg() {
            const input = document.getElementById('question');
            const btn = document.getElementById('send-btn');
            const box = document.getElementById('chat-box');

            const question = input.value.trim();

            // 빈 질문 차단
            if (!question) {
                alert('질문을 입력해주세요.');
                return;
            }

            // 중복 전송 방지
            input.disabled = true;
            btn.disabled = true;

            // 사용자 질문 화면에 먼저 표시
            appendMessage(
                'user',
                question
            );

            input.value = '';

            box.scrollTop = box.scrollHeight;


            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        question: question
                    })
                });


                // JWT 만료 또는 인증 실패
                if (res.status === 401) {
                    alert('로그인이 만료되었습니다.');
                    logout();
                    return;
                }


                const data = await res.json();


                // FastAPI 오류 응답
                if (!res.ok) {
                    let errorMessage = '요청 처리 실패';

                    if (typeof data.detail === 'string') {
                        errorMessage = data.detail;
                    } else if (typeof data.response === 'string') {
                        errorMessage = data.response;
                    }

                    appendMessage(
                        'bot',
                        errorMessage,
                        true
                    );

                    return;
                }


                // 정상 AI 응답
                appendMessage(
                    'bot',
                    data.response
                );


            } catch (err) {
                console.error(
                    '채팅 요청 실패:',
                    err
                );

                appendMessage(
                    'bot',
                    '네트워크 연결 실패',
                    true
                );


            } finally {
                input.disabled = false;
                btn.disabled = false;

                input.focus();

                box.scrollTop = box.scrollHeight;
            }
        }
    </script>

</body>
</html>
