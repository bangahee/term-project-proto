<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #chat-box { border: 1px solid #ddd; background: #fafafa; height: 420px; overflow-y: auto; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .user { font-weight: bold; color: #0056b3; }
        .bot { font-weight: bold; color: #28a745; }
        .error-msg { font-weight: bold; color: #dc3545; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 18px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .logout-btn { background: #dc3545; padding: 6px 12px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 AI 챗봇 서비스</h2>
        <div>
            <span>로그인 계정: <b id="user-display"></b></span>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
    </div>

    <div id="chat-box"></div>

    <div class="input-group">
        <input type="text" id="question" placeholder="질문을 입력하세요..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button id="send-btn" onclick="sendMsg()">전송</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const currentUsername = localStorage.getItem('username');

        // 인증 상태 검증: 토큰이 없으면 로그인 페이지로 강제 이동 (접근 제어)
        window.onload = () => {
            if (!token) {
                alert("로그인이 필요합니다.");
                window.location.href = '/login';
                return;
            }
            document.getElementById('user-display').innerText = currentUsername;
            loadChatHistory();
        };

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        async function loadChatHistory() {
            try {
                const res = await fetch('/api/me/chats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) { // 토큰 만료 시
                    logout();
                    return;
                }
                const logs = await res.json();
                
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                logs.forEach(log => {
                    box.innerHTML += `<div class="msg"><span class="user">${currentUsername}:</span> ${log.question}</div>`;
                    box.innerHTML += `<div class="msg"><span class="bot">챗봇:</span> ${log.response}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            } catch (err) {
                console.error("이력 로드 실패:", err);
            }
        }

        async function sendMsg() {
            const input = document.getElementById('question');
            const btn = document.getElementById('send-btn');
            const question = input.value.trim();

            if (!question) return alert("질문을 입력해주세요.");

            input.disabled = true;
            btn.disabled = true;

            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="msg"><span class="user">${currentUsername}:</span> ${question}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ question })
                });

                const data = await res.json();

                if (!res.ok) {
                    box.innerHTML += `<div class="msg error-msg"><span class="bot">오류:</span> ${data.detail || data.response || '요청 처리 실패'}</div>`;
                } else {
                    box.innerHTML += `<div class="msg"><span class="bot">챗봇:</span> ${data.response}</div>`;
                }
            } catch (err) {
                box.innerHTML += `<div class="msg error-msg"><span class="bot">오류:</span> 네트워크 연결 실패</div>`;
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>
